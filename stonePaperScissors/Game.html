<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stone Paper Scissors — a simple round-based browser game.">
    <title class="titleTag"></title>

    <!-- Filled scissors mark, no stroke/border, embedded so the page stays a single self-contained file. -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='30' cy='76' r='14' fill='%233ecf8e'/%3E%3Ccircle cx='70' cy='76' r='14' fill='%233ecf8e'/%3E%3Crect x='46' y='6' width='8' height='72' rx='4' fill='%233ecf8e' transform='rotate(24 50 50)'/%3E%3Crect x='46' y='6' width='8' height='72' rx='4' fill='%233ecf8e' transform='rotate(-24 50 50)'/%3E%3C/svg%3E">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Start screen: collects the player's name before the match begins -->
    <div class="startContainer">
        <h1 class="h1Tag"></h1>
        <div class="inp">
            <input class="usernameBox" placeholder="username" autocomplete="off">
            <button type="button" class="submit">Choose this!</button>
        </div>
        <div class="startError">
            <p class="error"></p>
        </div>
        <div class="startmessage">
            <p class="messageNotification"></p>
        </div>
    </div>

    <!-- Main game board: scoreboard + choice tiles for both sides -->
    <div class="container">
        <div class="scores">
            <div class="user">
                <span class="userName"></span>
                <span class="userScore">0</span>
            </div>
            <div class="bot">
                <span class="botScore">0</span>
                <span class="botName">bot</span>
            </div>
        </div>

        <div class="select">
            <div class="goToPlayRound">
                <button class="goToPlayRoundBut"></button>
            </div>

            <div class="userSelection" id="userSelection">
                <div class="profile">
                    <svg xmlns="http://www.w3.org/2000/svg" width="80px" fill="none" viewBox="0 0 24 24"
                        stroke-width="1" stroke="white" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                </div>
                <div class="userSelect">
                    <div class="paper itemBox one userItem" data-choice="paper">
                        <svg viewBox="0 0 24 24" width="80px" fill="none" stroke="white" stroke-width="1"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="white" />
                            <polyline points="14 2 14 8 20 8" stroke="white" />
                            <line x1="8" y1="13" x2="16" y2="13" stroke="white" />
                            <line x1="8" y1="17" x2="16" y2="17" stroke="white" />
                            <line x1="8" y1="9" x2="10" y2="9" stroke="white" />
                        </svg>
                        <span class="details">paper</span>
                    </div>
                    <div class="stone itemBox two userItem" data-choice="stone">
                        <svg xmlns="http://www.w3.org/2000/svg" width="80px" fill="white" viewBox="0 0 24 24"
                            stroke-width="1" stroke="white" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.25 15a4.5 4.5 0 0 0 4.5 4.5H18a3.75 3.75 0 0 0 1.332-7.257 3 3 0 0 0-3.758-3.848 5.25 5.25 0 0 0-10.233 2.33A4.502 4.502 0 0 0 2.25 15Z" />
                        </svg>
                        <span class="details">stone</span>
                    </div>
                    <div class="scissors itemBox three userItem" data-choice="scissors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="80px" fill="none" viewBox="0 0 24 24"
                            stroke-width="1" stroke="white" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m7.848 8.25 1.536.887M7.848 8.25a3 3 0 1 1-5.196-3 3 3 0 0 1 5.196 3Zm1.536.887a2.165 2.165 0 0 1 1.083 1.839c.005.351.054.695.14 1.024M9.384 9.137l2.077 1.199M7.848 15.75l1.536-.887m-1.536.887a3 3 0 1 1-5.196 3 3 3 0 0 1 5.196-3Zm1.536-.887a2.165 2.165 0 0 0 1.083-1.838c.005-.352.054-.695.14-1.025m-1.223 2.863 2.077-1.199m0-3.328a4.323 4.323 0 0 1 2.068-1.379l5.325-1.628a4.5 4.5 0 0 1 2.48-.044l.803.215-7.794 4.5m-2.882-1.664A4.33 4.33 0 0 0 10.607 12m3.736 0 7.794 4.5-.802.215a4.5 4.5 0 0 1-2.48-.043l-5.326-1.629a4.324 4.324 0 0 1-2.068-1.379M14.343 12l-2.882 1.664" />
                        </svg>
                        <span class="details">scissors</span>
                    </div>
                </div>
            </div>

            <div class="botSelection" id="botSelection">
                <div class="profile">
                    <svg xmlns="http://www.w3.org/2000/svg" width="80px" fill="none" viewBox="0 0 24 24"
                        stroke-width="1.5" stroke="white" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8.25 3v1.5M4.5 8.25H3m18 0h-1.5M4.5 12H3m18 0h-1.5m-15 3.75H3m18 0h-1.5M8.25 19.5V21M12 3v1.5m0 15V21m3.75-18v1.5m0 15V21m-9-1.5h10.5a2.25 2.25 0 0 0 2.25-2.25V6.75a2.25 2.25 0 0 0-2.25-2.25H6.75A2.25 2.25 0 0 0 4.5 6.75v10.5a2.25 2.25 0 0 0 2.25 2.25Zm.75-12h9v9h-9v-9Z" />
                    </svg>
                </div>
                <div class="botSelect">
                    <div class="itemBox botItemSelected">
                        <div class="loader"></div>
                        <span class="details">I am waiting your choice!</span>
                    </div>
                    <div class="paper itemBox four botItem" data-choice="paper">
                        <svg viewBox="0 0 24 24" width="80px" fill="none" stroke="white" stroke-width="1"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="white" />
                            <polyline points="14 2 14 8 20 8" stroke="white" />
                            <line x1="8" y1="13" x2="16" y2="13" stroke="white" />
                            <line x1="8" y1="17" x2="16" y2="17" stroke="white" />
                            <line x1="8" y1="9" x2="10" y2="9" stroke="white" />
                        </svg>
                        <span class="details">paper</span>
                    </div>
                    <div class="stone itemBox five botItem" data-choice="stone">
                        <svg xmlns="http://www.w3.org/2000/svg" width="80px" fill="white" viewBox="0 0 24 24"
                            stroke-width="1" stroke="white" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.25 15a4.5 4.5 0 0 0 4.5 4.5H18a3.75 3.75 0 0 0 1.332-7.257 3 3 0 0 0-3.758-3.848 5.25 5.25 0 0 0-10.233 2.33A4.502 4.502 0 0 0 2.25 15Z" />
                        </svg>
                        <span class="details">stone</span>
                    </div>
                    <div class="scissors itemBox six botItem" data-choice="scissors">
                        <svg xmlns="http://www.w3.org/2000/svg" width="80px" fill="none" viewBox="0 0 24 24"
                            stroke-width="1" stroke="white" class="size-6">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m7.848 8.25 1.536.887M7.848 8.25a3 3 0 1 1-5.196-3 3 3 0 0 1 5.196 3Zm1.536.887a2.165 2.165 0 0 1 1.083 1.839c.005.351.054.695.14 1.024M9.384 9.137l2.077 1.199M7.848 15.75l1.536-.887m-1.536.887a3 3 0 1 1-5.196 3 3 3 0 0 1 5.196-3Zm1.536-.887a2.165 2.165 0 0 0 1.083-1.838c.005-.352.054-.695.14-1.025m-1.223 2.863 2.077-1.199m0-3.328a4.323 4.323 0 0 1 2.068-1.379l5.325-1.628a4.5 4.5 0 0 1 2.48-.044l.803.215-7.794 4.5m-2.882-1.664A4.33 4.33 0 0 0 10.607 12m3.736 0 7.794 4.5-.802.215a4.5 4.5 0 0 1-2.48-.043l-5.326-1.629a4.324 4.324 0 0 1-2.068-1.379M14.343 12l-2.882 1.664" />
                        </svg>
                        <span class="details">scissors</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Activity log: every round event is appended here as a comment entry -->
    <div class="comment">
        <div class="sub">Match Log</div>
        <div class="comments"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
